<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>ENVY — Archive</title>
<style>
:root{--bg:#070809;--card:#101214;--line:#282c2f;--txt:#f5f2e9;--muted:#8d918f;--gold:#c6b985}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}.app{max-width:600px;margin:auto;padding-bottom:105px}
.splash{position:fixed;inset:0;background:#070809;z-index:99;display:grid;place-items:center;animation:out .7s 1.5s forwards}.slogo{font:46px Georgia;letter-spacing:13px;margin-left:13px}.sline{height:1px;background:var(--gold);width:0;margin:16px auto;animation:line .7s .4s forwards}.splash p{text-align:center;color:#888;font-size:9px;letter-spacing:4px;opacity:0;animation:fade .6s .7s forwards}
@keyframes out{to{opacity:0;visibility:hidden}}@keyframes line{to{width:76px}}@keyframes fade{to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
header{padding:22px 20px 10px;position:sticky;top:0;z-index:5;background:#070809e8;backdrop-filter:blur(15px)}.top{display:flex;justify-content:space-between}.logo{font:22px Georgia;letter-spacing:6px}.mini,.count{color:var(--muted);font-size:9px;letter-spacing:2px;text-transform:uppercase}.round{border:1px solid var(--line);background:#101315;color:#ddd;width:40px;height:40px;border-radius:50%}
.hero{padding:30px 20px 20px}.hero h1{font:39px/1.03 Georgia;margin:8px 0}.hero p{color:var(--muted);font-size:13px;line-height:1.6}.kicker{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.toolbar{display:flex;gap:9px;padding:0 20px 16px}.search{flex:1;background:#0d1012;border:1px solid var(--line);border-radius:13px;padding:12px;color:white;outline:0}.add{border:0;border-radius:13px;padding:0 17px;background:linear-gradient(135deg,#e2d5a8,#97875b);font-weight:800}
.filters{display:flex;gap:8px;overflow:auto;padding:0 20px 18px}.filter{white-space:nowrap;border:1px solid var(--line);background:#0d1012;color:#919594;border-radius:99px;padding:9px 13px;font-size:11px}.filter.active{background:#ded2aa;color:#111}
.section{padding:0 20px}.head{display:flex;justify-content:space-between;align-items:end;margin:8px 0 13px}.head h2{font:25px Georgia;margin:0}
.card{background:linear-gradient(145deg,#111416,#0b0d0f);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px;animation:rise .45s both;box-shadow:0 20px 50px #0007}.pic{position:relative;aspect-ratio:1.1;overflow:hidden;background:#090b0c}.pic img{width:100%;height:100%;object-fit:cover;transition:.45s}.card:active img{transform:scale(1.03)}.badge{position:absolute;left:12px;top:12px;background:#090b0dcc;border:1px solid #fff2;padding:7px 9px;border-radius:99px;font-size:9px}.fav{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid #fff2;background:#090b0dcc;color:white;font-size:19px}.info{padding:14px 15px 16px}.name{font:20px Georgia}.meta,.note{font-size:10px;color:var(--muted);margin-top:5px}.note{font-size:11px;line-height:1.45;margin-top:10px}.empty{text-align:center;padding:60px 15px;color:var(--muted)}.empty h3{font:28px Georgia;color:#ddd}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);height:82px;display:flex;justify-content:space-around;align-items:center;background:#080a0cee;border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:10}.nav{border:0;background:none;color:#777;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:5px}.nav b{font-size:20px;font-weight:400}.nav.active{color:#e3d9b7}.nav.add{color:#080909;background:var(--gold);width:52px;height:52px;border-radius:50%;font-size:23px}
.viewer{position:fixed;inset:0;background:#030405f7;z-index:30;display:none;flex-direction:column}.viewer.open{display:flex}.vtop{display:flex;justify-content:space-between;padding:18px 16px}.vtop button{border:1px solid #fff2;background:#111;color:#fff;border-radius:50%;width:42px;height:42px}.vimg{flex:1;display:grid;place-items:center;padding:10px 18px}.vimg img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px}.vbottom{padding:15px 20px 28px}.vbottom h2{font:25px Georgia;margin:0}.vbottom p{color:var(--muted);font-size:11px}
dialog{width:min(540px,94vw);border:1px solid var(--line);border-radius:24px;background:#0c0f11;color:white;padding:0}dialog::backdrop{background:#000c}.modal{padding:22px}.modal h2{font:29px Georgia;margin:0 0 18px}.field{margin:12px 0}.field label{display:block;color:#888;font-size:9px;letter-spacing:2px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#07090a;border:1px solid var(--line);color:white;border-radius:12px;padding:12px}.field textarea{min-height:80px}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#14181a;color:white}.actions .primary{border:0;background:linear-gradient(135deg,#e2d5a8,#97875b);color:#090a0a;font-weight:800}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);opacity:0;background:#e1d6ae;color:#0a0b0b;padding:10px 15px;border-radius:99px;font-size:11px;z-index:50;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div class="splash"><div><div class="slogo">ENVY</div><div class="sline"></div><p>Private design archive</p></div></div>
<div class="app"><header><div class="top"><div><div class="logo">ENVY</div><div class="mini">Mockup archive</div></div><button class="round" id="more">•••</button></div></header><main id="main"></main></div>
<nav><button class="nav active" data-tab="home"><b>⌂</b>Home</button><button class="nav" data-tab="library"><b>▦</b>Library</button><button class="nav add" id="addBtn">+</button><button class="nav" data-tab="favorites"><b>♡</b>Saved</button><button class="nav" id="about"><b>◌</b>About</button></nav>
<div class="viewer" id="viewer"><div class="vtop"><span class="mini">ENVY / PREVIEW</span><button id="close">×</button></div><div class="vimg"><img id="vimg"></div><div class="vbottom"><h2 id="vname"></h2><p id="vmeta"></p></div></div>
<dialog id="dlg"><form method="dialog" class="modal" id="form"><h2>Add to archive</h2><div class="field"><label>Mockup image</label><input id="file" type="file" accept="image/*" required></div><div class="field"><label>Name</label><input id="name" placeholder="ENVY Signature Hoodie" required></div><div class="field"><label>Category</label><select id="category"><option>Hoodies</option><option>T-Shirts</option><option>Bottoms</option><option>Shoes</option><option>Accessories</option><option>Other</option></select></div><div class="field"><label>Notes</label><textarea id="desc" placeholder="Collection, colorway, ideas..."></textarea></div><div class="actions"><button value="cancel">Cancel</button><button class="primary">Add mockup</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
const DB='envy_premium_v2';let db,tab='home',filter='All',query='';const cats=['All','Hoodies','T-Shirts','Bottoms','Shoes','Accessories','Other'];const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function all(){return new Promise(ok=>{let q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>b.created-a.created))})}function put(x){return new Promise(ok=>{let q=db.transaction('items','readwrite').objectStore('items').put(x);q.onsuccess=()=>ok()})}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
async function render(){let xs=await all(),ys=xs.filter(x=>(filter==='All'||x.category===filter)&&(tab!=='favorites'||x.favorite)&&(query===''||x.name.toLowerCase().includes(query.toLowerCase())));document.getElementById('main').innerHTML=(tab==='home'?'<section class="hero"><div class="kicker">Private design archive</div><h1>Your ideas.<br>Kept beautifully.</h1><p>A private space for your clothing mockups, concepts and visual direction. Everything stays on this device.</p></section>':'')+'<div class="toolbar"><input class="search" id="search" placeholder="Search archive..." value="'+esc(query)+'"><button class="add" id="quick">＋</button></div><div class="filters">'+cats.map(c=>'<button class="filter '+(filter===c?'active':'')+'" onclick="filter=\''+c+'\';render()">'+c+'</button>').join('')+'</div><section class="section"><div class="head"><h2>'+(tab==='favorites'?'Saved mockups':'Your archive')+'</h2><span class="count">'+ys.length+' ITEMS</span></div>'+(ys.length?ys.map(card).join(''):'<div class="empty"><h3>Nothing here yet</h3><div>Tap + to add your first mockup.</div></div>')+'</section>';document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('quick').onclick=openAdd}
function card(x){return '<article class="card"><div class="pic" onclick="view(\''+x.id+'\')"><img src="'+x.image+'"><span class="badge">'+esc(x.category)+'</span><button class="fav" onclick="event.stopPropagation();fav(\''+x.id+'\')">'+(x.favorite?'♥':'♡')+'</button></div><div class="info"><div class="name">'+esc(x.name)+'</div><div class="meta">Added '+new Date(x.created).toLocaleDateString()+'</div>'+(x.desc?'<div class="note">'+esc(x.desc)+'</div>':'')+'</div></article>'}
async function fav(id){let x=(await all()).find(a=>a.id===id);x.favorite=!x.favorite;await put(x);render()}async function view(id){let x=(await all()).find(a=>a.id===id);document.getElementById('vimg').src=x.image;document.getElementById('vname').textContent=x.name;document.getElementById('vmeta').textContent=x.category+(x.desc?' • '+x.desc:'');document.getElementById('viewer').classList.add('open')}function openAdd(){document.getElementById('dlg').showModal()}
document.getElementById('addBtn').onclick=openAdd;document.getElementById('close').onclick=()=>viewer.classList.remove('open');document.querySelectorAll('.nav[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));b.classList.add('active');render()});about.onclick=()=>toast('ENVY • local-only archive');more.onclick=()=>toast('Your mockups stay on this device.');
form.addEventListener('submit',e=>{e.preventDefault();let f=file.files[0],r=new FileReader();r.onload=async()=>{await put({id:crypto.randomUUID(),image:r.result,name:name.value.trim(),category:category.value,desc:desc.value.trim(),favorite:false,created:Date.now()});dlg.close();form.reset();toast('Added to ENVY');render()};r.readAsDataURL(f)});openDB().then(render);
</script></body></html>
